# 四层分流规则（ENG-02）：层顺序固定，层内按 priority 升序，priority 必须同层唯一。
# 输出为 Mihomo 扁平规则列表；层与 priority 不进入产物。
# MATCH 只能出现在 fallback 层，且必须是最后一条（docs/REQUIREMENTS.md §5）。
rules:
  # 1. 特殊规则（最高优先级）
  special:
    - priority: 100
      rule: DOMAIN-SUFFIX,local,DIRECT
    # Tailscale CGNAT（含 MagicDNS 100.100.100.100 与所有节点 IP）必须直连，
    # 避免被 TUN/兜底规则捕获。MagicDNS 域名解析仍需由 Tailscale DNS 负责。
    - priority: 110
      rule: IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

    # dsh-pocket 的 Cloudflare 隧道端点必须直连，避免被 TUN/兜底规则捕获。
    # 参考：https://github.com/shaobeichen/dsh-pocket README 的 DIRECT 建议。
    - priority: 120
      rule: DOMAIN-SUFFIX,argotunnel.com,DIRECT
    - priority: 130
      rule: DOMAIN-SUFFIX,trycloudflare.com,DIRECT
    - priority: 140
      rule: IP-CIDR,198.41.192.0/24,DIRECT,no-resolve

    # Tailscale 控制面与 MagicDNS 域名直连；节点 CGNAT 已由 priority 110 覆盖。
    - priority: 150
      rule: DOMAIN-SUFFIX,tailscale.com,DIRECT
    - priority: 160
      rule: DOMAIN-SUFFIX,tailscale.io,DIRECT
    - priority: 170
      rule: DOMAIN-SUFFIX,ts.net,DIRECT

  # 2. 业务规则（ENG-02 最小代表集；业务名单保持在仓库内联，不使用 Provider）
  business:
    # Google → Google 组（美国优先，组内自动回退）
    - priority: 100
      rule: DOMAIN-SUFFIX,google.com,Google
    - priority: 110
      rule: DOMAIN-SUFFIX,googleapis.com,Google
    - priority: 120
      rule: DOMAIN-SUFFIX,gstatic.com,Google
    - priority: 130
      rule: DOMAIN-SUFFIX,googleusercontent.com,Google

    # AI → 各自独立策略组
    - priority: 200
      rule: DOMAIN-SUFFIX,openai.com,OpenAI
    - priority: 210
      rule: DOMAIN-SUFFIX,chatgpt.com,OpenAI
    - priority: 220
      rule: DOMAIN-SUFFIX,oaistatic.com,OpenAI
    - priority: 230
      rule: DOMAIN-SUFFIX,oaiusercontent.com,OpenAI
    - priority: 300
      rule: DOMAIN-SUFFIX,anthropic.com,Claude
    - priority: 310
      rule: DOMAIN-SUFFIX,claude.ai,Claude
    - priority: 400
      rule: DOMAIN-SUFFIX,cursor.com,Cursor
    - priority: 410
      rule: DOMAIN-SUFFIX,cursor.sh,Cursor

    # Apple → 直连
    - priority: 500
      rule: DOMAIN-SUFFIX,apple.com,DIRECT
    - priority: 510
      rule: DOMAIN-SUFFIX,icloud.com,DIRECT
    - priority: 520
      rule: DOMAIN-SUFFIX,mzstatic.com,DIRECT

    # 国内金融 → 直连
    - priority: 600
      rule: DOMAIN-SUFFIX,icbc.com.cn,DIRECT
    - priority: 610
      rule: DOMAIN-SUFFIX,ccb.com.cn,DIRECT
    - priority: 620
      rule: DOMAIN-SUFFIX,abchina.com,DIRECT
    - priority: 630
      rule: DOMAIN-SUFFIX,boc.cn,DIRECT

    # BT → 直连
    - priority: 700
      rule: DOMAIN-KEYWORD,tracker,DIRECT

  # 3. 基础规则（ENG-06：Provider 锁定的 domain 集 → 直连）
  base:
    - priority: 90
      rule: RULE-SET,geosite-private,DIRECT
    - priority: 100
      rule: GEOIP,LAN,DIRECT,no-resolve
    - priority: 110
      rule: RULE-SET,geosite-cn,DIRECT
    - priority: 120
      rule: GEOIP,CN,DIRECT

  # 4. 兜底规则（最低优先级，必须最后）
  fallback:
    - priority: 100
      rule: MATCH,PROXY
