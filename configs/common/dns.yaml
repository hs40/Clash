# 公共 DNS 配置（两平台共用；构建期由 validate_dns 校验）。
# 取值为 MVP 草案，部署前必须按 docs/REQUIREMENTS.md §14 核验。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 境外 DoH 必须经代理查询：直连在中国大陆会被阻断，导致 DIRECT 域名解析超时。
  fallback:
    - https://1.1.1.1/dns-query#PROXY
    - https://dns.google/dns-query#PROXY
  fallback-filter:
    geoip: true
    geoip-code: CN
