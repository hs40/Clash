# 策略组：ENG-01 起成员由构建期生成，不再手写节点名单。
# include: all            → 全部节点，按 proxies.yaml 顺序
# include: region:<组名>  → 该地区的全部节点；该地区没有节点时填入「自动选择」
# icon: <名称>            → 构建期内联 assets/icons/<名称>.svg 为 base64 data URI
# 七个地区入口名称由负责人确认，不得改写（docs/REQUIREMENTS.md §4.1）。
# 地区入口与自动选择改为 url-test 自动测速（2026-11-14 负责人确认，§4.2）。
proxy-groups:
  - name: PROXY
    type: select
    icon: proxy
    proxies:
      - 自动选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 狮城节点
      - 美国节点
      - 其他节点
      - DIRECT

  # 自动选择：对全部节点做延迟测速。
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: auto
    include: all

  # 七个地区入口：组内自动测速，不再手选单个节点（2026-11-14）。
  - name: 香港节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: hk
    include: region:香港节点

  - name: 台湾节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: tw
    include: region:台湾节点

  - name: 日本节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: jp
    include: region:日本节点

  - name: 韩国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: kr
    include: region:韩国节点

  - name: 狮城节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: sg
    include: region:狮城节点

  - name: 美国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: us
    include: region:美国节点

  - name: 其他节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: other
    include: region:其他节点

  # Google：美国优先，按负责人确认的白名单顺序自动回退（2026-11-10）。
  - name: Google
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: google
    proxies:
      - 美国节点
      - 狮城节点
      - 日本节点
      - 香港节点

  # AI 业务组（ENG-02）：OpenAI 为 fallback（2026-11-14 负责人确认），
  # Claude / Cursor 保持手选，默认自动选择。
  - name: OpenAI
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: openai
    proxies:
      - 美国节点
      - 狮城节点
      - 日本节点
      - 韩国节点

  - name: Claude
    type: select
    icon: claude
    proxies: [自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 狮城节点, 美国节点, 其他节点]

  - name: Cursor
    type: select
    icon: cursor
    proxies: [自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 狮城节点, 美国节点, 其他节点]
