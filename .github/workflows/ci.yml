name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"

      - name: 安装锁定依赖
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check

      - name: 校验依赖锁定
        run: python scripts/check_dependencies.py

      - name: 构建双平台配置
        run: python scripts/build.py --platform all

      - name: 敏感信息扫描
        run: python scripts/security_scan.py

      - name: CI 策略检查
        run: python scripts/ci_policy.py

      - name: 运行测试并生成中文报告
        run: python scripts/ci_report.py --output ci-report.md

      - name: 下载并校验 Mihomo v1.19.33
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp_mihomo, .tmp_mihomo_test | Out-Null
          $url = (python -c "import yaml; print(yaml.safe_load(open('security/mihomo.yaml', encoding='utf-8'))['url'])").Trim()
          Invoke-WebRequest -Uri $url -OutFile .tmp_mihomo/mihomo.zip
          python scripts/check_mihomo.py --archive .tmp_mihomo/mihomo.zip
          Expand-Archive -Path .tmp_mihomo/mihomo.zip -DestinationPath .tmp_mihomo/extracted -Force
          python scripts/check_mihomo.py --binary .tmp_mihomo/extracted/mihomo-windows-amd64.exe

          # GeoIP 仅用于 -t 加载校验；内容哈希固定，上游 latest 变化时 CI 会阻断。
          Invoke-WebRequest -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb" -OutFile .tmp_mihomo_test/Country.mmdb
          $hash = (Get-FileHash .tmp_mihomo_test/Country.mmdb -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c0c6ea5661a3167abb24bbbaf629605aa3856c425384cbf2897c5a0f41027663") {
            throw "Country.mmdb SHA-256 不匹配"
          }

          & .tmp_mihomo/extracted/mihomo-windows-amd64.exe -t -f dist/windows/config.yaml -d .tmp_mihomo_test
          if ($LASTEXITCODE -ne 0) { throw "Windows 配置 Mihomo -t 失败" }
          & .tmp_mihomo/extracted/mihomo-windows-amd64.exe -t -f dist/openclash/config.yaml -d .tmp_mihomo_test
          if ($LASTEXITCODE -ne 0) { throw "OpenClash 配置 Mihomo -t 失败" }
