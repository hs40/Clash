name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.3"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build release packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if (-not $version.StartsWith("v")) {
            throw "发布标签必须以 v 开头：$version"
          }
          python scripts/release.py --version $version --out release
          python scripts/release.py --verify "release/$($version.Substring(1))"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME
          $dir = "release/" + $version.Substring(1)
          $notes = Join-Path $dir "RELEASE-NOTES.md"
          gh release create $version `
            (Join-Path $dir "windows-$($version.Substring(1)).zip") `
            (Join-Path $dir "openclash-$($version.Substring(1)).zip") `
            (Join-Path $dir "SHA256SUMS") `
            --title "Clash 配置 $version" `
            --notes-file $notes
