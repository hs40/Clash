name: Provider Check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.3"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check pinned provider sources
        run: python scripts/update_providers.py --check --json provider-check.json
      - name: Open review issue when upstream changed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = Get-Content provider-check.json -Raw | ConvertFrom-Json
          if (-not $report.changed) {
            Write-Output "Provider 上游无变化"
            exit 0
          }
          $lines = @("上游内容与锁定快照不同，需要负责人审查后更新：", "")
          foreach ($item in $report.providers) {
            if ($item.changed) {
              $lines += "- " + $item.provider + "：" + $item.current_sha256 + " -> " + $item.upstream_sha256 + "（" + $item.upstream_bytes + " 字节）"
            }
          }
          $lines += ""
          $lines += "请使用 scripts/update_providers.py 在本地更新分支，不要直接修改 main。"
          $body = $lines -join "`n"
          gh issue create --title "Provider 上游更新待审核" --body $body
