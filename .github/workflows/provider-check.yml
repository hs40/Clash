name: Provider Check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.3"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check pinned provider sources
        run: python scripts/update_providers.py --check --json provider-check.json
      - name: Open review pull request when upstream changed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content provider-check.json -Raw | ConvertFrom-Json
          if (-not $report.changed) {
            Write-Output "Provider 上游无变化"
            exit 0
          }
          $open = gh pr list --state open --json number,headRefName | ConvertFrom-Json
          $pending = @($open | Where-Object { $_.headRefName -like "provider/update-*" })
          if ($pending.Count -gt 0) {
            Write-Output "已存在待审 Provider 更新 PR #$($pending[0].number)，本次不重复创建"
            exit 0
          }
          python scripts/update_providers.py --apply --json provider-update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $update = Get-Content provider-update.json -Raw | ConvertFrom-Json
          $branch = $update.branch
          if (-not $branch) {
            Write-Output "上游已与锁定快照一致，本次不建分支"
            exit 0
          }
          $lines = @("上游内容与锁定快照不同，自动生成本 PR 供负责人审查。", "")
          foreach ($item in $update.providers) {
            if ($item.changed) {
              $lines += "- " + $item.provider + "：" + $item.current_sha256 + " -> " + $item.upstream_sha256 + "（" + $item.upstream_bytes + " 字节）"
            }
          }
          $lines += ""
          $lines += "上游 commit：" + $update.commit
          $lines += ""
          $lines += "合并前请确认：CI 通过、快照与锁文件一致、规则引用无需调整。本工作流不自动合并。"
          $body = $lines -join "`n"
          Set-Content -Path provider-update.md -Value $body -Encoding utf8
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c $branch
          git add providers/lock.yaml providers/snapshots
          git commit -m "chore(provider): 更新至 $($update.commit)"
          git push origin $branch
          gh pr create --base main --head $branch --title "chore(provider): 更新至 $($update.commit)" --body-file provider-update.md
